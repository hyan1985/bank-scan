name: 银行股每日扫描

on:
  schedule:
    # 目标实际执行约北京时间 23:00。GitHub 调度器有约 2 小时延迟，
    # 故提前到 UTC 13:05（北京 21:05）触发，避开整点高负载。
    - cron: '5 13 * * 1-5'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

concurrency:
  group: bank-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 写入密钥
        run: |
          echo "TUSHARE_TOKEN=${{ secrets.TUSHARE_TOKEN }}" > .env
          if [ -n "${{ secrets.DEEPSEEK }}" ]; then
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK }}" >> .env
          fi

      - name: 运行每日扫描
        run: python bank_daily_scan.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}

      - name: 提交扫描结果并更新面板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/ dashboard.html index.html
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "auto: 更新 $(date +%Y-%m-%d) 扫描数据 [skip ci]"
            git push
          fi
