name: 银行股每日扫描

on:
  schedule:
    # 周一至周五 15:30 UTC（北京时间 23:30）收盘后自动扫描
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

concurrency:
  group: bank-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 写入密钥
        run: |
          echo "TUSHARE_TOKEN=${{ secrets.TUSHARE_TOKEN }}" > .env
          if [ -n "${{ secrets.DEEPSEEK }}" ]; then
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK }}" >> .env
          fi

      - name: 运行每日扫描
        run: python bank_daily_scan.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK }}

      - name: 生成页面用最新数据
        run: |
          LATEST_CSV=$(ls -t output/bank_scan_*.csv | head -1)
          cp "$LATEST_CSV" output/bank_scan_latest.csv
          if ls -t output/ai_interpret_*.md >/dev/null 2>&1; then
            LATEST_MD=$(ls -t output/ai_interpret_*.md | head -1)
            cp "$LATEST_MD" output/ai_interpret_latest.md
          fi

      - name: 提交扫描结果
        run: |
          git config user.name "bank-scan-bot"
          git config user.email "bank-scan-bot@users.noreply.github.com"
          git add -f output/
          if git diff --cached --quiet; then
            echo "无新的扫描结果"
          else
            git commit -m "每日扫描 ${TODAY}" 2>/dev/null || true
            git push
          fi
        env:
          TODAY: $(date +%Y%m%d)
