<meta charset="UTF-8">

<title>银行股每日上车提示</title>
<style>
:root {
  --bg: #181818; --card: #222; --border: #333;
  --text: #e4e4e4; --muted: #888; --muted2: #999;
  --green: #3fa266; --amber: #f0a040; --red: #dd5555; --blue: #70b0d8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); padding: 24px 20px 60px;
  max-width: 1150px; margin: 0 auto;
}
h1 { font-size: 22px; font-weight: 700; }
.subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; text-align: center; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat-card.fire .value { color: var(--green); }
.stat-card.near .value { color: var(--amber); }
.stat-card.wait .value { color: var(--muted); }
h2 { font-size: 16px; font-weight: 600; margin: 24px 0 12px; color: #aaa; }
.tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
.tab.active { background: #333; color: var(--text); border-color: #555; }
table { width: 100%; border-collapse: collapse; font-size: 13px; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { background: #2a2a2a; font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
td { border-bottom: 1px solid #2a2a2a; }
tr:last-child td { border-bottom: none; }
tr:hover { background: #2a2a2a; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.pill-fire { background: #1f3a2a; color: var(--green); border: 1px solid #2a553a; }
.pill-near { background: #3a2e1a; color: var(--amber); border: 1px solid #554428; }
.pill-wait { background: #222; color: var(--muted); border: 1px solid #444; }
.ai-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; line-height: 1.8; font-size: 14px; white-space: pre-wrap; }
.ai-box h3 { font-size: 14px; margin: 8px 0 4px; }
.footer { margin-top: 32px; font-size: 11px; color: var(--muted); text-align: center; }
.empty { text-align: center; padding: 30px; color: var(--muted); }
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  table { font-size: 11px; }
  th, td { padding: 6px 6px; }
  .hide-mobile { display: none; }
}
</style>
</head>

<script>
var allRows = Array.isArray(SCAN_DATA) ? SCAN_DATA : [];
var currentFilter = 'all';

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtNum(v, digits) {
  if (v === null || v === undefined || v === '') return '—';
  var n = Number(v);
  if (isNaN(n)) return '—';
  return n.toFixed(digits === undefined ? 2 : digits);
}
function signalRank(s) {
  if (s === '射击范围') return 0;
  if (s === '参考上车') return 1;
  if (String(s).startsWith('等待')) return 2;
  return 3;
}
function pill(s) {
  if (s === '射击范围') return '<span class="pill pill-fire">射击范围</span>';
  if (s === '参考上车') return '<span class="pill pill-near">参考上车</span>';
  return '<span class="pill pill-wait">' + esc(s) + '</span>';
}

function renderStats() {
  var fire = allRows.filter(function(r){ return r.signal === '射击范围'; }).length;
  var near = allRows.filter(function(r){ return r.signal === '参考上车'; }).length;
  var wait = allRows.filter(function(r){ return String(r.signal).startsWith('等待'); }).length;
  var total = allRows.length;
  var date = allRows.length ? allRows[0].trade_date : '';
  document.getElementById('updated').textContent = '交易日 ' + date + ' · 共 ' + total + ' 只银行';
  document.getElementById('stats').innerHTML =
    '<div class="stat-card fire"><div class="value">' + fire + '</div><div class="label">🔥 射击范围</div></div>' +
    '<div class="stat-card near"><div class="value">' + near + '</div><div class="label">🎯 参考上车</div></div>' +
    '<div class="stat-card wait"><div class="value">' + wait + '</div><div class="label">⏳ 等待</div></div>' +
    '<div class="stat-card"><div class="value">' + total + '</div><div class="label">🏦 扫描总数</div></div>';
}

function renderTable() {
  var filtered = currentFilter === 'all' ? allRows : allRows.filter(function(r){
    if (currentFilter === 'fire') return r.signal === '射击范围';
    if (currentFilter === 'near') return r.signal === '参考上车';
    if (currentFilter === 'wait') return String(r.signal).startsWith('等待');
    return true;
  });
  if (!filtered.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">当前筛选无数据</div>';
    return;
  }
  var html = filtered.map(function(r){
    return '<tr>' +
      '<td><b>' + esc(r.name) + '</b></td>' +
      '<td class="hide-mobile" style="color:var(--muted)">' + esc(r.type || '') + '</td>' +
      '<td>' + fmtNum(r.close) + '</td>' +
      '<td>' + fmtNum(r.pe_natural_year) + '</td>' +
      '<td class="hide-mobile">' + fmtNum(r.eps_natural_year_est, 3) + '</td>' +
      '<td class="hide-mobile">' + fmtNum(r.dps_recent_fy, 3) + '</td>' +
      '<td class="hide-mobile">' + fmtNum(r.pe_price) + '</td>' +
      '<td class="hide-mobile">' + fmtNum(r.div_price) + '</td>' +
      '<td><b>' + fmtNum(r.buy_price) + '</b></td>' +
      '<td>' + pill(r.signal) + '</td>' +
    '</tr>';
  }).join('');
  document.getElementById('tableWrap').innerHTML =
    '<table><thead><tr>' +
    '<th>银行</th><th class="hide-mobile">类型</th><th>现价</th><th>自然年PE</th>' +
    '<th class="hide-mobile">预估EPS</th><th class="hide-mobile">每股分红</th>' +
    '<th class="hide-mobile">PE估值价</th><th class="hide-mobile">股息估值价</th>' +
    '<th>参考上车价</th><th>信号</th>' +
    '</tr></thead><tbody>' + html + '</tbody></table>';
}

function renderAI() {
  var box = document.getElementById('aiBox');
  if (!AI_TEXT || !AI_TEXT.trim()) { box.innerHTML = '<div class="empty">未生成解读</div>'; return; }
  var md = AI_TEXT;
  md = md.replace(/^###?\s*(.+)$/gm, '<h3>$1</h3>')
         .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
         .replace(/^[-*]\s+(.+)$/gm, '• $1');
  box.innerHTML = md;
}

document.getElementById('filters').addEventListener('click', function(e){
  var btn = e.target.closest('.tab');
  if (!btn) return;
  currentFilter = btn.dataset.f;
  document.querySelectorAll('#filters .tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderTable();
});

allRows.sort(function(a, b){ return signalRank(a.signal) - signalRank(b.signal); });
renderStats();
renderTable();
renderAI();
</script>
